name: ICON Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icon-release-main
  cancel-in-progress: true

jobs:
  release-windows:
    if: github.ref == 'refs/heads/main'
    name: Publish a new ICON version when package.json changes
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version and prepare release tag
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            if (!/^[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$/.test(version)) {
              core.setFailed(`Version invalide dans package.json : ${version}`);
              return;
            }

            const tag = `v${version}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            try {
              const existingRelease = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              if (existingRelease.data && !existingRelease.data.draft) {
                core.notice(`La version ${tag} est déjà publiée. Aucune nouvelle release à créer.`);
                core.setOutput('should_publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            try {
              const existingTag = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existingTag.data.object.sha !== sha) {
                await github.rest.git.updateRef({
                  owner, repo, ref: `tags/${tag}`, sha, force: true
                });
                core.info(`Tag ${tag} déplacé vers le commit courant après une publication incomplète.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/tags/${tag}`, sha
              });
              core.info(`Tag ${tag} créé.`);
            }

            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('should_publish', 'true');

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: npm install --no-audit --no-fund

      - name: Run source contract tests
        if: steps.release.outputs.should_publish == 'true'
        run: npm test

      - name: Build and publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Announce stable release on Discord
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.warning('Secret DISCORD_WEBHOOK_URL absent : annonce Discord ignorée. Configure-le dans Settings > Secrets and variables > Actions.');
              return;
            }

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG
            });

            if (release.draft || release.prerelease) {
              core.warning('La Release est en brouillon ou en préversion : aucune annonce Discord envoyée.');
              return;
            }

            const body = (release.body || 'Une nouvelle version est disponible. Consultez la publication GitHub pour découvrir les nouveautés et télécharger la mise à jour.').slice(0, 3500);
            const payload = {
              username: 'KAVIO Updates',
              embeds: [{
                title: `ICON — ${release.tag_name}`,
                url: release.html_url,
                description: body,
                color: 12632256,
                fields: [
                  { name: 'Application', value: 'ICON', inline: true },
                  { name: 'Version', value: release.tag_name, inline: true }
                ],
                footer: { text: 'KAVIO • Publication officielle • ICON' },
                timestamp: release.published_at
              }],
              allowed_mentions: { parse: [] }
            };

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const detail = await response.text();
              core.setFailed(`Échec du webhook Discord (${response.status}) : ${detail.slice(0, 500)}`);
              return;
            }

            core.info(`Annonce Discord envoyée pour ICON ${release.tag_name}.`);
