name: ICON Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier (exemple : v0.2.1)"
        required: true
        default: "v0.2.1"
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version and tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:EVENT_NAME -eq "workflow_dispatch") { $tag = $env:INPUT_TAG } else { $tag = $env:REF_NAME }
          $expected = "v$version"
          if ($tag -ne $expected) { throw "Le tag $tag ne correspond pas à la version du package ($expected)." }
          "ICON_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Version validée : $tag"

      - name: Create tag for manual publication
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.ICON_RELEASE_TAG;
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`
              });
              if (existing.data.object.sha !== context.sha) {
                core.setFailed(`Le tag ${tag} existe déjà sur un autre commit.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
              core.info(`Tag créé : ${tag}`);
            }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish GitHub Release
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
