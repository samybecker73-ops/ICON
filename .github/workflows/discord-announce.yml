name: ICON Discord Announcement (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à annoncer (0.2.1 ou v0.2.1 ; vide = dernière version stable)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  announce:
    name: Announce an existing ICON release
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.discord }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Webhook Discord absent : vérifie le secret DISCORD_WEBHOOK_URL dans Settings > Secrets and variables > Actions.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requestedTag = (process.env.RELEASE_TAG_INPUT || '').trim();
            const normalizeTag = value => String(value || '').trim().replace(/^v/i, '').toLowerCase();

            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const stable = releases
              .filter(item => !item.draft && !item.prerelease && item.published_at)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            let release;
            if (requestedTag) {
              release = stable.find(item =>
                item.tag_name.toLowerCase() === requestedTag.toLowerCase() ||
                normalizeTag(item.tag_name) === normalizeTag(requestedTag)
              );
              if (!release) {
                const available = [...new Set(stable.map(item => item.tag_name))].slice(0, 12);
                core.setFailed('Version "' + requestedTag + '" introuvable. Versions disponibles : ' + (available.join(', ') || 'aucune') + '. Tu peux saisir 0.2.1 ou v0.2.1.');
                return;
              }
            } else {
              release = stable[0];
            }

            if (!release) {
              core.setFailed('Aucune Release stable n’a été trouvée dans ICON.');
              return;
            }

            // Ignorer les entrées dupliquées d’un même tag pour choisir la version précédente.
            const seenTags = new Set([release.tag_name]);
            const uniqueOlder = stable.filter(item => {
              if (seenTags.has(item.tag_name)) return false;
              seenTags.add(item.tag_name);
              return new Date(item.published_at) < new Date(release.published_at);
            });
            const previous = uniqueOlder[0];

            let summary = '';
            if (previous) {
              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: previous.tag_name + '...' + release.tag_name
                });

                const categories = {
                  'Nouveautés': [],
                  'Corrections': [],
                  'Améliorations': [],
                  'Autres changements': []
                };

                for (const item of comparison.data.commits || []) {
                  const title = (((item.commit || {}).message) || '').split('\n')[0].trim();
                  if (!title || /^(merge pull request|merge branch)\b/i.test(title)) continue;
                  if (/^(ci|chore|docs|test|build|style)(\([^)]+\))?:/i.test(title)) continue;

                  if (/^(feat|feature)(\([^)]+\))?:/i.test(title)) categories['Nouveautés'].push(title.replace(/^[^:]+:\s*/, ''));
                  else if (/^(fix|bugfix)(\([^)]+\))?:/i.test(title)) categories['Corrections'].push(title.replace(/^[^:]+:\s*/, ''));
                  else if (/^(perf|refactor|security|improve|enhancement)(\([^)]+\))?:/i.test(title)) categories['Améliorations'].push(title.replace(/^[^:]+:\s*/, ''));
                  else categories['Autres changements'].push(title);
                }

                const sections = Object.entries(categories)
                  .filter(([, items]) => items.length)
                  .map(([label, items]) => '**' + label + '**\n' + [...new Set(items)].slice(0, 8).map(x => '• ' + x).join('\n'));

                summary = sections.length
                  ? '## Changements depuis ' + previous.tag_name + '\n' + sections.join('\n\n')
                  : 'Nouvelle version stable publiée. Consulte la publication GitHub pour le détail des fichiers et correctifs.';
              } catch (error) {
                core.warning('Comparaison indisponible : ' + error.message);
                summary = 'Nouvelle version stable publiée. Consulte la publication GitHub pour les détails.';
              }
            } else {
              summary = 'Première version stable disponible dans l’historique des publications.';
            }

            const intro = '**ICON — le centre de contrôle PC de KAVIO.**\\n' +
              'Retrouve les informations système, le suivi des ressources et les outils de diagnostic Windows dans une interface unifiée.\\n\\n';
            const finalBody = [intro + summary, (release.body || '').trim()].filter(Boolean).join('\n\n');

            const payload = {
              username: 'KAVIO Updates',
              embeds: [{
                title: 'ICON — ' + release.tag_name,
                url: release.html_url,
                description: finalBody.slice(0, 3500),
                color: 12632256,
                image: {
                  url: 'https://raw.githubusercontent.com/samybecker73-ops/ICON/main/assets/discord/icon-logo.png'
                },
                fields: [
                  { name: 'Application', value: 'ICON', inline: true },
                  { name: 'Version', value: release.tag_name, inline: true }
                ],
                footer: { text: 'KAVIO • Publication officielle • ICON' },
                timestamp: release.published_at
              }],
              allowed_mentions: { parse: [] }
            };

            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const detail = await response.text();
              core.setFailed('Échec du webhook Discord (' + response.status + ') : ' + detail.slice(0, 500));
              return;
            }

            core.info('Annonce Discord envoyée pour ICON ' + release.tag_name + '.');
